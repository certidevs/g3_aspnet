  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round">
    <path d="M112 78 C112 62 138 62 138 78 C138 89 125 89 125 100" opacity=".8"/>
    <path d="M214 46 C214 26 246 26 246 46 C246 60 230 60 230 74"/>
  </g>
  <g fill="#FFFFFF"><circle cx="125" cy="115" r="4" opacity=".8"/><circle cx="230" cy="92" r="5"/></g>
