<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340">
  <title>Coche perdido junto a una señal con una interrogación</title>
  <defs>
    <linearGradient id="g3body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2463B"/>
      <stop offset="1" stop-color="#B81E15"/>
    </linearGradient>
    <linearGradient id="g3glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CFE7F3"/>
      <stop offset="1" stop-color="#7FA9C0"/>
    </linearGradient>
  </defs>
  <!-- luz del foco -->
  <path d="M280 0 L120 300 H440 Z" fill="#FFFFFF" opacity=".05"/>
  <!-- suelo -->
  <rect x="0" y="290" width="560" height="50" fill="#0E0E0E"/>
  <rect x="0" y="290" width="560" height="5" fill="#EA271C"/>
  <g fill="#FFD43B" opacity=".9">
    <rect x="20" y="314" width="40" height="6" rx="2"/>
    <rect x="130" y="314" width="40" height="6" rx="2"/>
    <rect x="240" y="314" width="40" height="6" rx="2"/>
    <rect x="350" y="314" width="40" height="6" rx="2"/>
    <rect x="460" y="314" width="40" height="6" rx="2"/>
  </g>
  <!-- coche -->
  <g transform="translate(-8 96.6) scale(0.68)">
    <ellipse cx="280" cy="292" rx="235" ry="12" fill="#000" opacity=".5"/>
    <path d="M60 252 L66 222 Q72 206 96 200 L168 190 Q200 130 258 126 L352 126 Q400 130 428 188 L478 198 Q504 204 506 228 L510 252 Q510 262 500 262 H70 Q60 262 60 252 Z" fill="url(#g3body)"/>
